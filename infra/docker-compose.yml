version: '3.8'

services:
  # 1. App (Spring Boot)
  wagle-app:
    image: ${DOCKERHUB_USERNAME}/wagle-server:latest
    container_name: wagle-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=wagle-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      - wagle-redis
    networks:
      - wagle-network

  # 2. MySQL (데이터베이스)
  wagle-db:
    image: mysql:8.0
    container_name: wagle-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: wagle
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./db/mysql_data:/var/lib/mysql
    networks:
      - wagle-network

  # 3. Redis (캐시 & 위치 저장)
  wagle-redis:
    image: redis:alpine
    container_name: wagle-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./db/redis_data:/data
    networks:
      - wagle-network

  # 4. Nginx (사진 서빙)
  nginx-storage:
    image: nginx:latest
    container_name: nginx-storage
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./images:/usr/share/nginx/html
    networks:
      - wagle-network

  # 5. Prometheus (메트릭 수집 엔진)
  wagle-prometheus:
    image: prom/prometheus@sha256:899b369f202e252dfef80f3999e981a3d7fc7445228aa6098177acaf50349a76
    container_name: wagle-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - wagle-network

  # 6. Grafana (시각화 대시보드)
  wagle-grafana:
    image: grafana/grafana@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    container_name: wagle-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - wagle-prometheus
    networks:
      - wagle-network

networks:
  wagle-network:
    driver: bridge

volumes:
  prometheus-data:
