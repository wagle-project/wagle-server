spring:
  application:
    name: wagle-server
  sql:
    init:
      mode: never
  datasource:
    # 1. DB 주소: 프라이빗 서버의 비공개 IP를 도커가 주입해줄 수 있도록 설정
    url: jdbc:mysql://${DB_HOST}:3306/waglewagle?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari: # DB 확장에 따른 커넥션 풀 확장
      maximum-pool-size: 30
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false # 운영 환경에서 로그 부하를 줄이기 위해 false로 설정
  data:
    redis:
      # 2. Redis 주소
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}

jwt:
  token:
    # 3. 시크릿 키는 환경 변수로 분리
    secret-key: ${JWT_SECRET_KEY}
    expiration:
      access: 604800000 # 일주일 (기존 유지)

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true # 리다이렉트 문제를 방지

server:
  forward-headers-strategy: framework

cors:
  allowed-origins: http://localhost:3000,https://wagle-client.vercel.app