name: Deploy (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      concurrency_group:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/wagle-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deploy directory on NCP
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME || 'root' }}
          password: ${{ secrets.NCP_PASSWORD }}
          script: mkdir -p /root/deploy

      - name: Copy deployment and config files to NCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME || 'root' }}
          password: ${{ secrets.NCP_PASSWORD }}
          source: "infra/docker-compose.yml,infra/docker-compose-local.yml,infra/prometheus/prometheus.yml"
          target: /root/deploy

      - name: Deploy to NCP via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME || 'root' }}
          password: ${{ secrets.NCP_PASSWORD }}
          script: |
            cd /root/deploy
            export DOCKERHUB_USERNAME=${{ vars.DOCKERHUB_USERNAME }}
            export DB_HOST=${{ vars.DB_HOST }}
            export DB_USERNAME=${{ vars.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            export SPRING_PROFILES_ACTIVE=${{ inputs.environment == 'staging' && 'prod,staging' || 'prod' }}
            docker image prune -af
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/wagle-server:latest
            docker compose -f infra/docker-compose.yml up -d --no-deps --force-recreate wagle-app
            docker network connect infra_wagle-network wagle-nginx || true
            docker network connect infra_wagle-network wagle-redis || true
